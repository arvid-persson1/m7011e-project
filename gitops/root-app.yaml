apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: time-tracker-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arvid-persson1/m7011e-project.git
    targetRevision: proof_of_concept
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
