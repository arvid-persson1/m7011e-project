apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: group-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arvid-persson1/m7011e-project.git
    # TODO: Set to `HEAD`.
    targetRevision: proof_of_concept
    path: charts/group-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: time-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
