apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-statefulset
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.dbImage }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # HACK: Some k3s/Ubuntu hosts' default AppArmor profiles block the signals Postgres
            # uses during first-boot init, leaving it never listening on TCP.
            appArmorProfile:
              type: Unconfined
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.dbUser | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "`values.existingSecret` must be set per-release" .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgresdb
            - mountPath: /var/run/postgresql
              name: run
            - mountPath: /tmp
              name: tmp
          resources:
            requests:
              cpu: {{ .Values.dbResourceRequestCpu | quote }}
              memory: {{ .Values.dbResourceRequestMemory | quote }}
      volumes:
        - name: postgresdb
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
