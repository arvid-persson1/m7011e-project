apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service-postgresql
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arvid-persson1/m7011e-project.git
    # TODO: Set to `HEAD`.
    targetRevision: proof_of_concept
    path: gitops/manifests
    directory:
      recurse: false
      include: user-service-postgres.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: time-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
