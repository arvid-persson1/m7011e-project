apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: time-tracker-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arvid-persson1/m7011e-project.git
    targetRevision: main
    path: gitops/manifests/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: time-tracker
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
