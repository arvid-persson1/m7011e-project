[workspace]
members = ["services/user-service", "services/group-service"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://www.github.com/arvid-persson1/m7011e-project"

[workspace.dependencies]
rocket = { version = "0.5.4", default-features = false, features = ["http2", "json", "tls", "uuid"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
sqlx = { version = "0.9.1", default-features = false, features = ["derive", "postgres", "runtime-tokio", "uuid"] }

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
strip = "none"

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
# PERF: Consider "fat" and 1 if performance gain is worth the extra build time.
lto = "thin"
opt-level = 3
overflow-checks = false
panic = "abort"
strip = "symbols"

